<svg xmlns="http://www.w3.org/2000/svg" viewBox="-50 -60 1300 720" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1e1e1e"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b45309"/>
    </marker>
  </defs>

  <rect x="-50" y="-60" width="1300" height="720" fill="#ffffff"/>

  <text x="600" y="-20" font-size="26" text-anchor="middle" fill="#1e1e1e">Search Pipeline — POST /api/search</text>

  <!-- User Query -->
  <rect x="20" y="80" width="160" height="70" rx="12" fill="#a5d8ff" stroke="#1e1e1e" stroke-width="2"/>
  <text x="100" y="120" font-size="20" text-anchor="middle" fill="#1e1e1e">User Query</text>

  <!-- Router -->
  <polygon points="320,45 410,115 320,185 230,115" fill="#d0bfff" stroke="#1e1e1e" stroke-width="2"/>
  <text x="320" y="120" font-size="20" text-anchor="middle" fill="#1e1e1e">Router</text>

  <line x1="180" y1="115" x2="222" y2="115" stroke="#1e1e1e" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Direct Answer -->
  <rect x="480" y="40" width="220" height="80" rx="12" fill="#c3fae8" stroke="#1e1e1e" stroke-width="2"/>
  <text x="590" y="85" font-size="20" text-anchor="middle" fill="#1e1e1e">Direct Answer</text>
  <path d="M 410 87 L 472 80" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <text x="430" y="65" font-size="16" fill="#2563eb">direct</text>

  <!-- Web Search -->
  <rect x="480" y="220" width="190" height="80" rx="12" fill="#ffd8a8" stroke="#1e1e1e" stroke-width="2"/>
  <text x="575" y="265" font-size="20" text-anchor="middle" fill="#1e1e1e">Web Search</text>
  <path d="M 410 150 L 474 254" fill="none" stroke="#b45309" stroke-width="2" marker-end="url(#arrowOrange)"/>
  <text x="425" y="200" font-size="16" fill="#b45309">web</text>

  <!-- Open & Summarize -->
  <rect x="700" y="220" width="220" height="80" rx="12" fill="#ffd8a8" stroke="#1e1e1e" stroke-width="2"/>
  <text x="810" y="265" font-size="18" text-anchor="middle" fill="#1e1e1e">Open &amp; Summarize</text>
  <line x1="670" y1="260" x2="692" y2="260" stroke="#1e1e1e" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Compose Answer -->
  <rect x="950" y="220" width="200" height="80" rx="12" fill="#ffd8a8" stroke="#1e1e1e" stroke-width="2"/>
  <text x="1050" y="265" font-size="18" text-anchor="middle" fill="#1e1e1e">Compose Answer</text>
  <line x1="920" y1="260" x2="942" y2="260" stroke="#1e1e1e" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="700" y="318" font-size="14" fill="#757575">no page results → falls back to Direct Answer</text>

  <!-- Validate & Polish -->
  <rect x="520" y="400" width="300" height="80" rx="12" fill="#d0bfff" stroke="#1e1e1e" stroke-width="2"/>
  <text x="670" y="445" font-size="20" text-anchor="middle" fill="#1e1e1e">Validate &amp; Polish</text>

  <path d="M 685 120 L 685 392" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 1050 300 L 1050 340 L 750 340 L 750 392" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="520" y="500" font-size="14" fill="#757575">malformed JSON → repaired via a 2nd LLM call</text>

  <!-- Response -->
  <rect x="570" y="540" width="200" height="80" rx="12" fill="#a5d8ff" stroke="#1e1e1e" stroke-width="2"/>
  <text x="670" y="585" font-size="20" text-anchor="middle" fill="#1e1e1e">Response</text>
  <line x1="670" y1="480" x2="670" y2="532" stroke="#1e1e1e" stroke-width="2" marker-end="url(#arrow)"/>
</svg>
